<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>CreatorBlock</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>

    <header class="pop-header">
        <div class="pop-title">CreatorBlock</div>

        <label class="pop-switch" title="Turn all badges and filters on or off">
            <input type="checkbox" id="enabled">
            <span class="pop-switch-track"><span class="pop-switch-knob"></span></span>
            <span id="enabledLabel">On</span>
        </label>
    </header>

    <div id="pausedNote" class="pop-paused" hidden>
        CreatorBlock is paused: no badges and no filters are applied.
    </div>

    <section class="pop-section">
        <h2>This video</h2>
        <div id="videoBody"></div>
    </section>

    <section class="pop-section">
        <h2>What the filters do</h2>
        <div id="legendBody"></div>
    </section>

    <section class="pop-section">
        <h2>My Filters</h2>
        <div id="filtersBody"></div>
    </section>

    <section class="pop-section">
        <h2>Add a creator to My Filters</h2>
        <div id="addBody"></div>
    </section>

    <section class="pop-section">
        <details id="ownerDetails">
            <summary>I'm a creator</summary>
            <div id="ownerBody"></div>
        </details>
    </section>

    <section class="pop-section">
        <details id="adminDetails">
            <summary>Admin</summary>
            <div id="adminBody"></div>
        </details>
    </section>

    <script src="shared.js"></script>
    <script src="popup.js"></script>
</body>
</html>
